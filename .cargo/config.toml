[env]
# Windows (MSVC): point the pkg-config crate at GStreamer's SDK. These are
# target-suffixed, so they're ignored on Linux, which uses the system pkg-config.
PKG_CONFIG_x86_64_pc_windows_msvc = "C:\\Program Files\\gstreamer\\1.0\\msvc_x86_64\\bin\\pkg-config.exe"
PKG_CONFIG_PATH_x86_64_pc_windows_msvc = "C:\\Program Files\\gstreamer\\1.0\\msvc_x86_64\\lib\\pkgconfig"
