[package]
name = "crimson-screenlive-portable"
version.workspace = true
edition.workspace = true
license-file.workspace = true
description = "Single-file portable launcher: unpacks the app to a per-user cache and starts it"

[[bin]]
name = "CrimsonScreenLive"
path = "src/main.rs"

[dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
crc32fast = "1"
winresource = "0.1"
